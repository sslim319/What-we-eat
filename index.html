<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff8dc">
  <title>What Shall We Eat? - Lucky Draw</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff8dc;
      color: #333;
      text-align: center;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 14px max(30px, env(safe-area-inset-bottom));
    }
    h1 { color: #c0392b; font-size: clamp(25px, 7vw, 34px); margin: 12px 0 8px; }
    .subtitle { color: #775b36; font-size: 14px; margin-bottom: 18px; }
    #progress-container {
      width: 90%; max-width: 420px; height: 14px; background: #eee;
      border-radius: 10px; overflow: hidden; margin: 18px auto; display: none;
    }
    #progress-bar {
      height: 100%; width: 0%; background: #e67e22;
      transition: width 2s ease-in-out;
    }
    .grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px; width: 100%; max-width: 460px; margin: 24px auto;
    }
    .item {
      background: #fff; border: 2px dashed #f39c12; border-radius: 12px;
      padding: 12px 6px; min-height: 86px; font-size: clamp(13px, 3.7vw, 16px);
      font-weight: 700; position: relative; display: flex; align-items: center;
      justify-content: center; overflow-wrap: anywhere;
    }
    .item.selected { background: #2ecc71; color: white; border-color: #27ae60; }
    .arrow {
      position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
      font-size: 20px; display: none; animation: bounce .6s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateX(-50%) translateY(0); }
      to { transform: translateX(-50%) translateY(-5px); }
    }
    button {
      appearance: none; border: 0; border-radius: 30px; padding: 14px 34px;
      min-height: 50px; font-size: 18px; font-weight: 700;
      background: linear-gradient(45deg, #e67e22, #e74c3c);
      color: white; cursor: pointer; margin: 8px 5px;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: .55; cursor: default; }
    #result { min-height: 32px; margin: 16px auto 0; color: #c0392b; font-size: 20px; font-weight: 800; }
    @media (max-width: 350px) {
      .grid { gap: 7px; }
      .item { min-height: 76px; padding: 9px 4px; }
    }
  </style>
</head>
<body>
  <h1>🎯 What Shall We Eat?</h1>
  <div class="subtitle">Tap the button and let fate decide!</div>

  <div id="progress-container"><div id="progress-bar"></div></div>
  <div class="grid" id="foodGrid"></div>
  <button id="drawButton" type="button">Start Draw</button>
  <button id="resetButton" type="button">Reset</button>
  <div id="result" aria-live="polite"></div>

  <script>
    // Edit this list to change your food choices.
    const foods = [
      "Chicken Rice", "Zap Fan", "Sukiya", "Teppanyaki",
      "Ichiban Ramen", "Sushi Jiro", "Yi Poh", "Thai Aroi",
      "OD", "Aunty Zap Fan", "Kuali"
    ];

    const grid = document.getElementById("foodGrid");
    const progress = document.getElementById("progress-bar");
    const progressContainer = document.getElementById("progress-container");
    const drawButton = document.getElementById("drawButton");
    const resetButton = document.getElementById("resetButton");
    const result = document.getElementById("result");
    let drawTimer = null;

    foods.forEach(food => {
      const div = document.createElement("div");
      div.className = "item";
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "⬇️";
      div.appendChild(arrow);
      div.appendChild(document.createTextNode(food));
      grid.appendChild(div);
    });

    function clearSelection() {
      document.querySelectorAll(".item").forEach(item => {
        item.classList.remove("selected");
        item.querySelector(".arrow").style.display = "none";
      });
      result.textContent = "";
    }

    function startDraw() {
      if (drawButton.disabled || foods.length === 0) return;
      clearSelection();
      drawButton.disabled = true;
      progressContainer.style.display = "block";
      progress.style.transition = "none";
      progress.style.width = "0%";
      void progress.offsetWidth;
      progress.style.transition = "width 2s ease-in-out";
      requestAnimationFrame(() => { progress.style.width = "100%"; });

      drawTimer = setTimeout(() => {
        const items = document.querySelectorAll(".item");
        const randomIndex = Math.floor(Math.random() * items.length);
        const selectedItem = items[randomIndex];
        selectedItem.classList.add("selected");
        selectedItem.querySelector(".arrow").style.display = "block";
        result.textContent = "🎉 " + foods[randomIndex] + "!";
        progressContainer.style.display = "none";
        progress.style.width = "0%";
        drawButton.disabled = false;
        drawTimer = null;
      }, 2200);
    }

    function resetDraw() {
      if (drawTimer !== null) clearTimeout(drawTimer);
      drawTimer = null;
      clearSelection();
      progressContainer.style.display = "none";
      progress.style.width = "0%";
      drawButton.disabled = false;
    }

    drawButton.addEventListener("click", startDraw);
    resetButton.addEventListener("click", resetDraw);
  </script>
</body>
</html>
